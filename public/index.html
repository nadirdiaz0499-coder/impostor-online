<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1020">
  <title>Impostor online</title>
  <meta name="description" content="Juego del Impostor online para 3 a 16 jugadores. Sin descargas ni registro.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎭</text></svg>">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="conn" hidden>Reconectando…</div>
  <main id="app"></main>

  <button id="chat-btn" type="button" aria-label="Chat" hidden>💬<span id="chat-badge" hidden>0</span></button>
  <section id="chat-panel" hidden>
    <header><strong>Chat</strong><button id="chat-close" type="button" aria-label="Cerrar">✕</button></header>
    <div id="chat-log"></div>
    <form id="chat-form" autocomplete="off">
      <input id="chat-input" maxlength="200" placeholder="Escribe un mensaje…" enterkeyhint="send">
      <button type="submit">Enviar</button>
    </form>
  </section>

  <div id="toast" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
